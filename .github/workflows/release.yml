name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Tag matches every version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/epcube/manifest.json'))['version'])")
          project=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          client=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' epcube_api/__init__.py)
          echo "tag=$VERSION manifest=$manifest pyproject=$project client=$client"
          [ "$VERSION" = "$manifest" ] || { echo "::error::tag $VERSION != manifest $manifest"; exit 1; }
          [ "$VERSION" = "$project" ] || { echo "::error::tag $VERSION != pyproject $project"; exit 1; }
          [ "$VERSION" = "$client" ] || { echo "::error::tag $VERSION != epcube_api $client"; exit 1; }

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Verify
        run: sh scripts/verify.sh

      - name: Build the HACS bundle
        run: sh scripts/build-release.sh epcube.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" epcube.zip \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

  validate-hacs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration
