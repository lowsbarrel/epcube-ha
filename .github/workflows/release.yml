name: Release

# HACS installs from GitHub releases only (hacs.json sets hide_default_branch),
# so nothing reaches a user until a v* tag is pushed here.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the manifest ships a version Home Assistant
      # reports differently from the one HACS installed, so refuse to build it.
      - name: Tag matches manifest and project version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/epcube/manifest.json'))['version'])")
          project=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$VERSION manifest=$manifest pyproject=$project"
          [ "$VERSION" = "$manifest" ] || { echo "::error::tag $VERSION != manifest $manifest"; exit 1; }
          [ "$VERSION" = "$project" ] || { echo "::error::tag $VERSION != pyproject $project"; exit 1; }

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # Never ship something that would have failed the merge gate.
      - name: Verify
        run: sh scripts/verify.sh

      # Bundles the client into the integration and proves the result imports.
      - name: Build the HACS bundle
        run: sh scripts/build-release.sh epcube.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" epcube.zip \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

  # HACS installability is a property of a *release*, not of a branch: with
  # zip_release set, HACS reads the integration manifest out of the published
  # zip. Validating before one exists reports a missing manifest, so the check
  # runs here, once the release is up.
  validate-hacs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # The repo is private, so the brands/images check cannot resolve it
          # against the public HACS index.
          ignore: brands
