name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never a push to the default branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Conventional Commits, enforced (AGENTS.md "Naming"). PR titles matter because
  # squash merges inherit them. Zero-dependency on purpose: an inline check keeps
  # the supply chain closed. Titles go through env vars, never inline
  # interpolation - PR titles are attacker-controlled input.
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          echo "$TITLE" | grep -qE "$pattern" \
            || { echo "PR title must be Conventional Commits, e.g. 'feat(auth): add password reset'"; exit 1; }
          [ "${#TITLE}" -le 72 ] || { echo "PR title over 72 characters"; exit 1; }
      - name: Commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            case "$subject" in "Merge "*) continue ;; esac
            echo "$subject" | grep -qE "$pattern" || { echo "not conventional: $subject"; bad=1; }
            [ "${#subject}" -le 72 ] || { echo "over 72 characters: $subject"; bad=1; }
          done < <(git log --format=%s "$BASE".."$HEAD")
          exit "$bad"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fail if template placeholders were never replaced (skipped on the template
      # repo itself, so the template's own CI stays green).
      - name: No unreplaced template placeholders
        if: ${{ !github.event.repository.is_template }}
        run: sh scripts/check-placeholders.sh
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # --locked, not --frozen: this also fails if uv.lock has drifted from
      # pyproject.toml, so a dependency added without re-locking is caught here
      # rather than resolving differently on someone else's machine.
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Verify (secret scan + lint + types + test)
        run: sh scripts/verify.sh

      # The release path, walked on every change. Nothing else exercises the
      # vendoring rewrite, so without this a broken bundle stays invisible until
      # a tag is pushed and the release fails with the version already public.
      - name: Build the HACS bundle
        run: sh scripts/build-release.sh epcube.zip

  # Home Assistant's own manifest/quality checks. Catches a malformed manifest,
  # a missing translation key, or a version that does not parse - none of which
  # the Python toolchain would notice.
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master, 2026-08-03

  # Single required check: the branch ruleset requires only `ci`, and this gate
  # depends on every blocking job. Add a new required job to `needs` here (one
  # home) and it blocks merges automatically - no ruleset edit, no repo-setup.sh
  # re-run. `always()` plus the explicit result check is load-bearing: a skipped
  # required check can otherwise be reported to branch protection as passing.
  ci:
    if: ${{ always() }}
    needs: [conventions, verify, hassfest]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          for r in "${{ needs.conventions.result }}" "${{ needs.verify.result }}" "${{ needs.hassfest.result }}"; do
            case "$r" in
              success | skipped) ;;
              *) echo "required job did not succeed: $r"; exit 1 ;;
            esac
          done
          echo "all required jobs succeeded"
