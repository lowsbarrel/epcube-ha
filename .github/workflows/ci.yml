name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: PR title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          echo "$TITLE" | grep -qE "$pattern" \
            || { echo "PR title must be Conventional Commits, e.g. 'feat(sensor): add grid outage count'"; exit 1; }
          [ "${#TITLE}" -le 72 ] || { echo "PR title over 72 characters"; exit 1; }
      - name: Commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9./-]+\))?!?: .+'
          bad=0
          while IFS= read -r subject; do
            case "$subject" in "Merge "*) continue ;; esac
            echo "$subject" | grep -qE "$pattern" || { echo "not conventional: $subject"; bad=1; }
            [ "${#subject}" -le 72 ] || { echo "over 72 characters: $subject"; bad=1; }
          done < <(git log --format=%s "$BASE".."$HEAD")
          exit "$bad"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Verify
        run: sh scripts/verify.sh
      - name: Build the HACS bundle
        run: sh scripts/build-release.sh epcube.zip

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  ci:
    if: ${{ always() }}
    needs: [conventions, verify, hassfest]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          for r in "${{ needs.conventions.result }}" "${{ needs.verify.result }}" "${{ needs.hassfest.result }}"; do
            case "$r" in
              success | skipped) ;;
              *) echo "required job did not succeed: $r"; exit 1 ;;
            esac
          done
          echo "all required jobs succeeded"
